name: Tests

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, gd, bcmath, redis
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Abhaengigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Syntax pruefen
        run: |
          git ls-files '*.php' | xargs -n 50 -P 4 php -l > /dev/null

      - name: Tests
        run: php artisan test --parallel --compact
